<!DOCTYPE html>
<html>
<head>
<title>Notice Me Senpai</title>
</head>
<body>

<div id ="start_screen">
    <p id="rules">Please refrain from moving too much, once you click the button keep a resting face without blinking</p>
	<button id= "start_button" onclick="showPage2()" style="width: 200px; height: 50px;">Start blink calibration??(KEEP YOUR EYES OPEN ONCE YOU CLICK THIS)</button>
<div id = "calibration">
<p id = "count_down" style="display: none; width: 200px; height: 50px;"></p>
</div>
</div>

<video id="video" autoplay muted style="width:1px; height:1px; opacity:0; position:absolute;"></video>
<canvas id="canvas">
</canvas>

<div id="join_screen" style="display: none;">
<input id="inputName" type="text" minlength="2" maxlength="20" size="10" />
<button id="joinBtn" onclick="handleJoin()">Join</button>
<p id="NameError"></p>
<p id="Connecting"></p>

<p id="Blinked">You have blinked this many times: </p>
<img src="img2.jpg" alt="hamster_pic(plz show the pic)">
</div>


<script type="module">

let camera_allowed = false
let total = 10
let my_list = []
let vid = document.getElementById("video")
let camera_stream = null;
function showPage2() {
	if(camera_allowed){
    document.getElementById('count_down').style.display = 'block';
    document.getElementById('start_button').style.display = 'none';
    document.getElementById('rules').style.display = 'none';
    const countdown = setInterval(function() {
    document.getElementById("count_down").textContent = "STARTING CALIBRATION...FINISHING IN "+total
    
    if (total <= 0) {
        document.getElementById("count_down").style.display = 'none'
        clearInterval(countdown);
    }
    total--;
    }, 1000);
    calibrateLoop();
    }
}
window.showPage2 = showPage2;

function joinPage(){
    document.getElementById('start_screen').style.display = 'none';
    document.getElementById('join_screen').style.display = 'block';
}


function stopCamera() {
    if (camera_stream) {
        camera_stream.getTracks().forEach(function(track) {
            track.stop();
        });
        vid.srcObject = null;
        camera_stream = null;
    }
}

import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
);

const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
  },
  runningMode: "VIDEO",
  numFaces: 1
});

const LEFT_EYE = [362, 385, 387, 263, 373, 380];
const RIGHT_EYE = [33, 160, 158, 133, 153, 144];
let blink_thresh = 0.30;
const succ_frame = 2;
let count_frame = 0;

function euclidean(p1, p2) {
    return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
}

function calculateEAR(eye) {
    const y1 = euclidean(eye[1], eye[5]);
    const y2 = euclidean(eye[2], eye[4]);
    const x1 = euclidean(eye[0], eye[3]);
    return (y1 + y2) / (2.0 * x1);
}

let count = 0
function detectLoop() {
    const results = faceLandmarker.detectForVideo(vid, performance.now());

    if (results.faceLandmarks.length > 0) {
        const landmarks = results.faceLandmarks[0];
        const leftEyePts = LEFT_EYE.map(i => landmarks[i]);
        const rightEyePts = RIGHT_EYE.map(i => landmarks[i]);

        const avg = (calculateEAR(leftEyePts) + calculateEAR(rightEyePts)) / 2;

        if (avg < blink_thresh) {
            count_frame++;
        } else {
            if (count_frame >= succ_frame) {
                count+=1
                document.getElementById("Blinked").textContent = "You have blinked this many times: " + count
                websocket.send("BLINK")	// notify server of blink
            }
            count_frame = 0;
        }
    }
  
    requestAnimationFrame(detectLoop);
}

function calibrateLoop() {

    const results = faceLandmarker.detectForVideo(vid, performance.now());

    if (results.faceLandmarks.length > 0) {
        const landmarks = results.faceLandmarks[0];
        const leftEyePts = LEFT_EYE.map(i => landmarks[i]);
        const rightEyePts = RIGHT_EYE.map(i => landmarks[i]);

        const avg = (calculateEAR(leftEyePts) + calculateEAR(rightEyePts)) / 2;
        my_list.push(avg)
        
    }
    if(total>0){
        requestAnimationFrame(calibrateLoop);
    }
    else{
        let sum = 0
        for (let item of my_list) {
            sum+= item
        }
        blink_thresh=(sum/my_list.length)* 0.7
        joinPage()
    }
}

let websocket = null;
let canvas = document.getElementById("canvas")
vid.addEventListener("loadedmetadata", function() {
    canvas.width = vid.videoWidth
    canvas.height = vid.videoHeight
})
let draw = canvas.getContext("2d")
let joined = false
navigator.mediaDevices.getUserMedia({video :true}).then(function(stream) {
		vid.srcObject = stream
        camera_stream = stream;
		camera_allowed = true
        const interval = setInterval(function() {
            if (!joined) {
                draw.drawImage(vid, 0, 0, canvas.width, canvas.height);
            } else {
                clearInterval(interval);
            }

        }, 50);
}).catch(function(err) {
    alert("Camera access is required to continue.");
});

// what happens when player clicks join!
function handleJoin()
{
	// check if valid
	let length = document.getElementById("inputName").value.length
	let nameErr = document.getElementById("NameError")
	if(length<2 || length>21){
		nameErr.textContent = "Please enter a name between 2 and 20 characters long";
		return;
	}
	nameErr.textContent = "";
	document.getElementById("Connecting").textContent = "Connecting..."

	websocket = new WebSocket("wss://noticemesenpai.duckdns.org");
	joined = true
	websocket.onopen = function(){
	document.getElementById("Connecting").textContent = ""
	document.getElementById("inputName").style.display = "none"
	document.getElementById("joinBtn").style.display = "none"
	websocket.send(document.getElementById("inputName").value)
	
    setInterval(function() {
        draw.drawImage(vid, 0, 0, canvas.width, canvas.height)
        websocket.send(canvas.toDataURL("image/jpeg", 0.7))
    }, 50) 
    detectLoop();

	}

	websocket.onerror = function(){
		nameErr.textContent = "Couldn't connect oh nooo try again"
		document.getElementById("Connecting").textContent = ""
	}



}
window.handleJoin = handleJoin;

let nameInput = document.getElementById("inputName")
let button = document.getElementById("joinBtn")
nameInput.oninput = function() {
    document.getElementById("NameError").textContent = "";

}

 
</script>
</body>
</html>
